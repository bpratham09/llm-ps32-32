<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 416' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='416' fill='#FFFFFF'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8A94A8'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='#1B2333'>Every answer comes from retrieved handbook chunks, with its page number</text><text x='36' y='62' font-size='12' font-weight='600' fill='#5B6478'>INDEXING · runs once per handbook</text><text x='36' y='212' font-size='12' font-weight='600' fill='#5B6478'>ANSWERING · runs for every question</text><g fill='none' stroke='#8A94A8' stroke-width='1.25'><path d='M160.0 104H177.0' marker-end='url(#a)'/><path d='M301.0 104H318.0' marker-end='url(#a)'/><path d='M442.0 104H459.0' marker-end='url(#a)'/><path d='M583.0 104H600.0' marker-end='url(#a)'/><path d='M160.0 254H177.0' marker-end='url(#a)'/><path d='M301.0 254H318.0' marker-end='url(#a)'/><path d='M442.0 254H459.0' marker-end='url(#a)'/><path d='M583.0 254H600.0' marker-end='url(#a)'/><path d='M662 132.0V180H380V226.0' stroke-dasharray='5 4' marker-end='url(#a)'/><path d='M662 282.0V336.0' marker-end='url(#a)'/></g><text x='388' y='206' font-size='11.5' fill='#5B6478'>similarity search</text><rect x='36.0' y='76.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='98' y='100' text-anchor='middle' font-weight='600' fill='#1B2333'>Handbook PDF</text><text x='98' y='118' text-anchor='middle' font-size='11.5' fill='#5B6478'>college rules</text><rect x='177.0' y='76.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='239' y='100' text-anchor='middle' font-weight='600' fill='#1B2333'>Load pages</text><text x='239' y='118' text-anchor='middle' font-size='11.5' fill='#5B6478'>PyPDFLoader</text><rect x='318.0' y='76.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='380' y='100' text-anchor='middle' font-weight='600' fill='#1B2333'>Split text</text><text x='380' y='118' text-anchor='middle' font-size='11.5' fill='#5B6478'>800-char chunks</text><rect x='459.0' y='76.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='521' y='100' text-anchor='middle' font-weight='600' fill='#1B2333'>Embed chunks</text><text x='521' y='118' text-anchor='middle' font-size='11.5' fill='#5B6478'>bge-small (local)</text><rect x='600.0' y='76.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='662' y='100' text-anchor='middle' font-weight='600' fill='#1B2333'>FAISS index</text><text x='662' y='118' text-anchor='middle' font-size='11.5' fill='#5B6478'>saved to disk</text><rect x='36.0' y='226.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='98' y='250' text-anchor='middle' font-weight='600' fill='#1B2333'>Question</text><text x='98' y='268' text-anchor='middle' font-size='11.5' fill='#5B6478'>typed in chat UI</text><rect x='177.0' y='226.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='239' y='250' text-anchor='middle' font-weight='600' fill='#1B2333'>Rewrite</text><text x='239' y='268' text-anchor='middle' font-size='11.5' fill='#5B6478'>follow-ups</text><rect x='318.0' y='226.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='380' y='250' text-anchor='middle' font-weight='600' fill='#1B2333'>Top-k chunks</text><text x='380' y='268' text-anchor='middle' font-size='11.5' fill='#5B6478'>with page nos.</text><rect x='459.0' y='226.0' width='124' height='56' rx='8' fill='#FAFBFF' stroke='#8A94A8' stroke-width='1.25'/><text x='521' y='250' text-anchor='middle' font-weight='600' fill='#1B2333'>Strict prompt</text><text x='521' y='268' text-anchor='midd